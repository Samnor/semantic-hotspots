name: Tests and wheel installation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build jsonschema
      - run: python tools/build_release.py
      - shell: bash
        run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python -m semantic_hotspots analyze examples/retail.bim -o smoke-report
      - run: python -m semantic_hotspots optimize-measure examples/rewrite-lab.bim "Revenue iterator" --table Sales -o smoke-measure
      - run: python -m semantic_hotspots optimize-measure src/semantic_hotspots/assets/demo.bim "Revenue iterator" --table Sales --matrices src/semantic_hotspots/assets/demo-matrices.json --landing-matrix monthly-margin -o smoke-landing-measure
      - run: python -m semantic_hotspots create-measure src/semantic_hotspots/assets/demo.bim "Revenue iterator" --table Sales --matrices src/semantic_hotspots/assets/demo-matrices.json --visual iterator-review -o smoke-created-measure
      - run: python -m semantic_hotspots simulate examples/retail.bim --fact-rows 1000 --dimension-rows 50 -o smoke-simulation
      - run: python -m semantic_hotspots simulate examples/rewrite-lab.bim --config examples/rewrite-config.json --fact-rows 1000 -o smoke-rewrite-lab
      - run: python -m semantic_hotspots experiment smoke-rewrite-lab -o smoke-rewrites
      - run: python -m semantic_hotspots matrices examples/matrix-model.bim --matrices examples/matrices.json -o smoke-matrices
      - run: python -m semantic_hotspots simulate examples/matrix-model.bim --matrices examples/matrices.json --fact-rows 1000 --dimension-rows 50 -o smoke-matrix-lab
      - run: python -m semantic_hotspots project examples/matrix-model.bim --matrices examples/matrices.json --matrix monthly-margin --config examples/showcase-config.json -o smoke-project
      - run: python tools/check_project_schemas.py smoke-project
      - run: python -m semantic_hotspots project examples/matrix-model.bim --matrices examples/matrices.json --matrix monthly-margin --measure Margin --table Sales --config examples/showcase-config.json -o smoke-landing-project
      - run: python tools/check_project_schemas.py smoke-landing-project
      - if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install "$(echo dist/*.whl)[engine]"
      - if: runner.os == 'Windows'
        run: python tools/check_adomd_client.py
