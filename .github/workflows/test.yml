name: Tests and wheel installation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python tools/build_release.py
      - shell: bash
        run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python -m semantic_hotspots analyze examples/retail.bim -o smoke-report
      - run: python -m semantic_hotspots simulate examples/retail.bim --fact-rows 1000 --dimension-rows 50 -o smoke-simulation
      - run: python -m semantic_hotspots simulate examples/rewrite-lab.bim --config examples/rewrite-config.json --fact-rows 1000 -o smoke-rewrite-lab
      - run: python -m semantic_hotspots experiment smoke-rewrite-lab -o smoke-rewrites
